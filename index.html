<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A192F" />

    <!-- Default/fallback SEO tags — overridden per-page by react-helmet-async (see src/components/SEO.jsx) -->
    <title>ENZ INTERNATIONAL | Global Sourcing, Factory Setup & China Market Entry</title>
    <meta
      name="description"
      content="ENZ INTERNATIONAL is a global sourcing and industrial consulting firm connecting East Africa, DRC, the US and UK with vetted Chinese manufacturers, turnkey factory setup, and commodity trading expertise."
    />
    <link rel="canonical" href="https://www.enzinternational.com/en/" />
    <link rel="icon" type="image/png" href="/images/enz-logo.png" />

    <!-- Performance: font preconnect + preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph (default; per-page overrides supplied via Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ENZ INTERNATIONAL" />
    <meta property="og:title" content="ENZ INTERNATIONAL | Global Sourcing, Factory Setup & China Market Entry" />
    <meta
      property="og:description"
      content="Your trusted partner for commodities trading, factory setup, and China market entry. Serving East Africa, DRC, US, UK and beyond."
    />
    <meta property="og:image" content="https://www.enzinternational.com/images/og-cover.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ENZ INTERNATIONAL | Global Sourcing & Industrial Excellence" />
    <meta
      name="twitter:description"
      content="Global sourcing, turnkey factory setup, and China market entry consulting for growing businesses worldwide."
    />
    <meta name="twitter:image" content="https://www.enzinternational.com/images/og-cover.jpg" />

    <!-- Organization structured data (static — present on every page) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ENZ INTERNATIONAL",
        "url": "https://www.enzinternational.com",
        "logo": "https://www.enzinternational.com/images/enz-logo.png",
        "description": "Global sourcing, turnkey factory establishment, and China market entry consulting.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+86-1320-384-0456",
          "contactType": "customer service",
          "areaServed": ["TZ", "KE", "CD", "US", "GB", "CN"],
          "availableLanguage": ["English", "Swahili", "French", "Chinese"]
        },
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
