server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — required because this is a client-side-routed app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache forever; index.html must always
    # be revalidated so deploys are picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
